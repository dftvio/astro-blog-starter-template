name: Auto Writer
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate post
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, datetime, re
          topics = [
            "Best AI Agent for Small Business Customer Support",
            "How Small Businesses Use AI Agents to Cut Costs",
            "AI Agents vs Chatbots: What Small Business Owners Should Know",
            "Best Free AI Tools for Freelancers in 2026",
            "How to Automate Invoicing with AI Agents",
            "AI Agents for E-commerce: A Practical Guide",
            "How Real Estate Agents Use AI to Save Time",
          ]
          day = datetime.date.today().timetuple().tm_yday
          topic = topics[day % len(topics)]
          prompt = f"""Write a blog post titled '{topic}'.
          Format: start with '---', then 'title: ...', 'description: ...', 'date: {datetime.date.today()}', then '---', then the post body (600-900 words, practical, for small business owners). No code fences."""
          body = json.dumps({"contents":[{"parts":[{"text":prompt}]}]}).encode()
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={os.environ['KEY']}"
          req = urllib.request.Request(url, data=body, headers={"Content-Type":"application/json"})
          res = json.loads(urllib.request.urlopen(req).read())
          text = res["candidates"][0]["content"]["parts"][0]["text"]
          text = re.sub(r'^```(?:markdown|md)?\n|```$', '', text.strip(), flags=re.M)
          slug = re.sub(r'[^a-z0-9]+', '-', topic.lower()).strip('-')
          os.makedirs("src/content/blog", exist_ok=True)
          open(f"src/content/blog/{slug}.md", "w").write(text)
          print("Wrote", slug)
          EOF
      - name: Publish
        run: |
          git config user.email "bot@github.com"
          git config user.name "Auto Writer"
          git add .
          git commit -m "Auto post $(date +%F)" || exit 0
          git push
